<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:12px;padding:11px 12px;background:{{ c.surface }};border:1px solid {{ c.border }};border-radius:14px">
  <div style="width:36px;height:36px;border-radius:10px;background:{{ c.surfaceHigh }};display:flex;align-items:center;justify-content:center;flex-shrink:0">{{ mov.icon }}</div>
  <div style="flex:1;min-width:0">
    <div style="font-size:14px;font-weight:600;color:{{ c.textPrimary }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ mov.name }}</div>
    <div style="font-size:12px;color:{{ c.textTertiary }};margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ mov.date }} · {{ mov.account }} · {{ mov.category }}</div>
  </div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:{{ c.negative }};flex-shrink:0">−{{ mov.display }}</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:56}}"></script>
</body>
</html>
